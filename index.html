<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LKSHNA | Brand Showcase</title>
    <style>
        :root {
            --primary-gold: #d4af37;
            --bg-dark: #121212;
            --text-light: #f4f4f4;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .ad-container {
            text-align: center;
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 4rem;
            max-width: 600px;
            position: relative;
            transition: transform 0.3s ease;
        }

        .ad-container:hover {
            transform: scale(1.02);
            border-color: var(--primary-gold);
        }

        .brand-name {
            font-size: 4rem;
            letter-spacing: 12px;
            text-transform: uppercase;
            font-weight: 300;
            margin: 0;
            background: linear-gradient(to right, #d4af37, #f7e1ad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            font-size: 1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #888;
            margin-top: 10px;
        }

        .divider {
            width: 50px;
            height: 2px;
            background-color: var(--primary-gold);
            margin: 30px auto;
        }

        .cta-button {
            background: transparent;
            color: var(--primary-gold);
            border: 1px solid var(--primary-gold);
            padding: 12px 30px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .cta-button:hover {
            background: var(--primary-gold);
            color: var(--bg-dark);
        }

        .initials-watermark {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.1);
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="ad-container">
        <div class="initials-watermark">L. KRISHNA S.</div>
        <h1 class="brand-name">LKSHNA</h1>
        <p class="tagline">Defining Modern Grace</p>
        <div class="divider"></div>
        <button class="cta-button">Discover the Collection</button>
    </div>

</body>
</html>S
